name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Create persistent keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/hshospital.keystore \
            -alias hshospital \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=HSHospital, OU=Android, O=HSHospital, L=Coimbatore, S=TN, C=IN"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          echo "$PWD/gradle-8.1/bin" >> $GITHUB_PATH

      - name: Build Signed APK
        run: |
          gradle assembleDebug \
            -Pandroid.injected.signing.store.file=$PWD/app/hshospital.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=hshospital \
            -Pandroid.injected.signing.key.password=android123 \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RePhrase-APK
          path: app/build/outputs/apk/debug/app-debug.apk
